name: tests

# Offline tests for the code that produces data/: the snapshot combiner and
# publisher, the BigGo collector and validator, and the BigGo daily builder.
on:
  pull_request:
  push:
    paths:
      - scrapers/combine/**
      - biggo/**
      - data/source/biggo_price_changes.csv
      - products/products.csv
      - .github/workflows/tests.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
      - name: Snapshot combiner and publisher
        run: python -m unittest discover -s scrapers/combine/tests -p 'test_*.py' -v
      - name: BigGo collector
        run: node --test biggo/scripts/test_collect_2025.cjs
      - name: BigGo validator
        run: |
          python -m unittest discover -s biggo/scripts -p 'test_*.py' -v
          python biggo/scripts/validate_2025.py
      - name: BigGo daily builder
        run: Rscript biggo/scripts/test_build_biggo_daily.R
