# Spec section 9: the daily momo and PChome runs. Coupang is not collected daily (dropped 2026-10-20, Q7).
name: scrape

on:
  # WF-8: an outside timer starts the runs on time (workflow_dispatch with timer=true) at
  # 15:07, and 18:07 and 23:07 on Nov 10-12. GitHub's schedule starts hours late, so it is
  # only the backup: 30 minutes after each slot, and it does nothing if that slot already ran.
  schedule:
    - cron: "37 7 * * *"       # backup for 15:07 Taiwan, Oct 19 - Nov 25
    - cron: "37 10 10-12 11 *" # backup for 18:07 Taiwan, Nov 10-12
    - cron: "37 15 10-12 11 *" # backup for 23:07 Taiwan, Nov 10-12
  workflow_dispatch:
    inputs:
      products:
        description: Product table to read
        default: products/products.csv
      timer:
        description: Started by the outside timer (applies the collection period, WF-3)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read # WF-8: the backup looks for an earlier run of its slot

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # WF-7
    strategy:
      fail-fast: false # WF-2
      matrix:
        platform: [momo, pchome]
    env:
      PLATFORM: ${{ matrix.platform }}
      PRODUCTS: ${{ inputs.products || 'products/products.csv' }}
    steps:
      - uses: actions/checkout@v5

      # WF-3: timer and scheduled runs outside Oct 19 - Nov 25 (Taiwan date) do nothing.
      # Other manual runs always run. WF-8: a scheduled backup does nothing if a manual run
      # started since 10 minutes before its slot and has not failed.
      - name: Decide whether to run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          TIMER: ${{ inputs.timer }}
        run: |
          day=$(TZ=Asia/Taipei date +%F)
          run=true
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            case "$SCHEDULE" in
              "37 7 * * *") slot_time=15:07 ;;
              "37 10 10-12 11 *") slot_time=18:07 ;;
              "37 15 10-12 11 *") slot_time=23:07 ;;
              *) echo "::error::Unknown schedule '$SCHEDULE'"; exit 1 ;;
            esac
            # The slot is the last time it came round: a backup can start after midnight.
            slot=$(TZ=Asia/Taipei date -d "$slot_time" +%s)
            if [ "$slot" -gt "$(date +%s)" ]; then slot=$((slot - 86400)); fi
            day=$(TZ=Asia/Taipei date -d "@$slot" +%F)
            since=$(date -u -d "@$((slot - 600))" +%Y-%m-%dT%H:%M:%SZ)
            covered=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/scrape.yml/runs" \
              -f event=workflow_dispatch -f created=">=$since" \
              --jq '[.workflow_runs[] | select(.status != "completed" or .conclusion == "success")] | length') || covered=0
            if [ "${covered:-0}" -gt 0 ]; then
              echo "The $day $slot_time slot already ran (manual run since $since); nothing to do."
              run=false
            else
              echo "::warning::No run for the $day $slot_time slot yet; the scheduled backup collects it."
            fi
          fi
          if { [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$TIMER" = true ]; } &&
             { [[ "$day" < 2026-10-19 ]] || [[ "$day" > 2026-11-25 ]]; }; then
            echo "Taiwan date $day is outside the collection period; nothing to do."
            run=false
          fi
          if [ ! -f "scrapers/$PLATFORM/scrape_$PLATFORM.R" ]; then
            echo "::warning::scrapers/$PLATFORM/scrape_$PLATFORM.R does not exist yet; $PLATFORM skipped."
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      # WF-4
      - uses: r-lib/actions/setup-r@v2
        if: steps.gate.outputs.run == 'true'
        with:
          r-version: "4.6.1"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.gate.outputs.run == 'true'
        with:
          packages: |
            any::httr2
            any::rvest
            any::xml2
            any::jsonlite
            any::chromote

      # WF-5
      - name: Scrape
        if: steps.gate.outputs.run == 'true'
        env:
          SCRAPER_CONTACT: ${{ secrets.SCRAPER_CONTACT }}
        run: |
          if [ -z "$SCRAPER_CONTACT" ]; then
            echo "::error::Repository secret SCRAPER_CONTACT is not set (WF-5)."
            exit 1
          fi
          Rscript "scrapers/$PLATFORM/scrape_$PLATFORM.R" "$PRODUCTS" 2>&1 | tee scrape.log

      # FR-8's summary line, shown on the run page.
      - name: Report summary
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          line=$(grep -E "^$PLATFORM: [0-9]+ products" scrape.log || true)
          echo "::notice title=$PLATFORM::${line:-no summary line (the scraper stopped early)}"

      # WF-6: this run's output file and raw/ folder as one artifact, whatever the exit code.
      - name: Find this run's files
        id: files
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          output=$(ls -t "scrapers/$PLATFORM/output/"*.csv 2>/dev/null | head -n 1 || true)
          if [ -z "$output" ]; then echo "found=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          stamp=$(basename "$output" .csv)
          stamp=${stamp#"${PLATFORM}_"}
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "name=${PLATFORM}_$stamp" >> "$GITHUB_OUTPUT"
          echo "output=$output" >> "$GITHUB_OUTPUT"
          echo "raw=scrapers/$PLATFORM/raw/$stamp" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always() && steps.files.outputs.found == 'true'
        with:
          name: ${{ steps.files.outputs.name }}
          path: |
            ${{ steps.files.outputs.output }}
            ${{ steps.files.outputs.raw }}
          retention-days: 90
