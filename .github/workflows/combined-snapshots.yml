name: combined snapshots

on:
  workflow_run:
    workflows: [scrape]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scrapers/combine/**
      - products/products.csv
      - .github/workflows/combined-snapshots.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: combined-snapshots
  cancel-in-progress: false

jobs:
  combine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      collect: ${{ steps.gate.outputs.collect }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check for a collection, rather than a skipped scheduled backup
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          collect=true
          if [ -n "$SOURCE_RUN" ]; then
            count=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name | test("^(momo|pchome)_[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{4}$"))] | length')
            if [ "${count:-0}" -eq 0 ]; then collect=false; fi
          fi
          echo "collect=$collect" >> "$GITHUB_OUTPUT"
      - name: Recover historical CSVs and append new snapshots
        if: steps.gate.outputs.collect == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          args=()
          if [ -n "$SOURCE_RUN" ]; then args+=(--required-run "$SOURCE_RUN"); fi
          python scrapers/combine/collect_snapshots.py --repo "$GITHUB_REPOSITORY" "${args[@]}"
      - name: Summarize coverage
        if: steps.gate.outputs.collect == 'true'
        shell: bash
        run: |
          echo '## Cumulative snapshot coverage' >> "$GITHUB_STEP_SUMMARY"
          cat output/combined/snapshot_runs.csv >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.collect == 'true'
        with:
          name: combined-snapshots
          path: output/combined/
          if-no-files-found: error
          retention-days: 90

  # Publish the cumulative snapshots into data/ on the branch that ran this
  # workflow (main for automatic runs). Only changed data is committed; a push
  # rejected by a concurrent update is retried once after a rebase, never forced.
  publish:
    needs: combine
    if: needs.combine.outputs.collect == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: combined-snapshots
          path: output/combined
      - name: Write data/snapshots.csv and data/products.csv
        run: python scrapers/combine/publish_snapshots.py
      - name: Commit only changed data
        shell: bash
        run: |
          git add -- data/snapshots.csv data/products.csv data/README.md
          if git diff --cached --quiet; then
            echo 'Published data already matches this build; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update data/snapshots.csv [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
          }
