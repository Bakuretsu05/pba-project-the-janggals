# Temporary: runs the Coupang scraper on its test products from a GitHub runner, to see whether
# Akamai lets a GitHub IP address through. Delete it once .github/workflows/scrape.yml (D6) exists.
name: Coupang scraper test

on:
  push:
    branches: [coupang-scraper]
    paths:
      - "scrapers/coupang/**"
      - ".github/workflows/coupang-test.yml"
  workflow_dispatch:

jobs:
  coupang:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCRAPER_CONTACT: ${{ secrets.SCRAPER_CONTACT || 'github-actions-test' }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::chromote
            any::rvest
            any::jsonlite
            any::processx
            any::xml2

      - name: Show Chrome
        run: |
          google-chrome --version
          Rscript -e 'cat(chromote::find_chrome(), "\n")'
          curl -s https://ipinfo.io/json | grep -E '"(city|region|country|org)"'

      - name: Run the scraper on the test products
        run: >
          xvfb-run -a --server-args="-screen 0 1920x1080x24"
          Rscript scrapers/coupang/scrape_coupang.R scrapers/coupang/test_products.csv

      - name: Show what came back
        if: always()
        run: |
          for f in scrapers/coupang/output/*.csv; do echo "== $f"; cat "$f"; done
          for f in scrapers/coupang/raw/*/*.html.gz; do
            echo "== $f: $(zcat "$f" | wc -c) bytes, $(zcat "$f" | grep -o '<title>[^<]*</title>' | head -1)"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coupang-test
          path: |
            scrapers/coupang/output/
            scrapers/coupang/raw/
          retention-days: 7
